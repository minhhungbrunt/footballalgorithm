name: Football Edge — Keep Scheduler Alive

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write scheduler heartbeat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path("data/.scheduler-heartbeat")
          p.write_text(datetime.now(timezone.utc).isoformat()+"\n")
          PY
          git config user.name "football-edge-bot"
          git config user.email "football-edge-bot@users.noreply.github.com"
          git add data/.scheduler-heartbeat
          git commit -m "Keep scheduler active" || true
          git push || true
