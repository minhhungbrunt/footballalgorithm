name: FootballEdge - Refresh Data + Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: football-edge
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull FotMob + RotoWire
        run: python scripts/update.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/fixtures.json")
          if not p.exists():
              raise SystemExit("ERROR: data/fixtures.json was not generated")
          data = json.loads(p.read_text())
          n = int(data.get("fixtureCount", 0))
          matches = data.get("matches", [])
          print(f"fixtureCount={n}")
          print(f"matches={len(matches)}")
          print(f"updatedAt={data.get('updatedAt')}")
          print(f"sourceStatus={data.get('sourceStatus')}")
          print(f"sourceErrors={data.get('sourceErrors', [])}")
          if n <= 0 or len(matches) <= 0:
              raise SystemExit("ERROR: zero fixtures; refusing to deploy an empty site")
          if n != len(matches):
              raise SystemExit("ERROR: fixtureCount does not match matches length")
          required = ("id", "competition", "home", "away", "status")
          for i, m in enumerate(matches):
              missing = [k for k in required if not m.get(k)]
              if missing:
                  raise SystemExit(f"ERROR: fixture {i} missing {missing}")
          print("FEED VALIDATION PASSED")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "football-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fixtures.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh football data"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload current site + current data
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy current site
        id: deployment
        uses: actions/deploy-pages@v4
