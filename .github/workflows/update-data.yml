name: Football Edge - Update Matchday

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update FotMob fixtures
        run: python3 scripts/update.py

      - name: Commit updated fixtures
        run: |
          git config user.name "football-edge-bot"
          git config user.email "football-edge-bot@users.noreply.github.com"
          git add data/fixtures.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update matchday data"
            git push
          fi
