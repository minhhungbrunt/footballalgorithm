name: Update FootballEdge data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: football-edge-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull FotMob + RotoWire
        run: python scripts/update.py
      - name: Commit data
        run: |
          git config user.name "football-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet || git commit -m "chore: refresh football data"
          git push
