name: Football Edge — Update Matchday

on:
  workflow_dispatch:
  schedule:
    # Stagger away from the top of the hour; GitHub scheduled jobs are UTC.
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: football-edge-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Update FotMob matchday
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 scripts/update.py
          test -s data/fixtures.json
          python3 - <<'PY2'
          import json
          p=json.load(open("data/fixtures.json"))
          n=int(p.get("fixtureCount",0))
          print(f"FotMob fixture count: {n}")
          if n <= 0:
              raise SystemExit("FotMob returned zero accepted fixtures; refusing to publish empty data")
          PY2

      - name: Commit data if changed
        run: |
          git config user.name "football-edge-bot"
          git config user.email "football-edge-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No fixture changes."
          else
            git commit -m "Update matchday data"
            git push
          fi
