name: FootballEdge refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: footballedge-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main before update
        run: git pull --rebase origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull FotMob
        run: python scripts/update.py

      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/fixtures.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(x.get("matches"), list) and x["matches"], "No fixtures generated"
          for m in x["matches"]:
              assert m.get("home") and m.get("away") and m.get("competition")
          print("VALID:", len(x["matches"]), "fixtures")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "football-edge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "chore: refresh football data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
