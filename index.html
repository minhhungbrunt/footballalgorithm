<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b10">
<title>FootballEdge — Matchday Intelligence</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FOOTBALL<span>EDGE</span></div>
  <div class="topmeta"><span id="feedStatus">LOADING</span><i></i><span>FOTMOB</span></div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">MATCHDAY INTELLIGENCE</div>
      <h1>Today's Football</h1>
      <p>Fixtures · live scores · form · H2H · league context · xG · lineups · model decision</p>
    </div>
    <div class="refresh">
      <div>Updated <b id="updated">—</b></div>
      <span id="pollStatus" class="poll-status">● LIVE DATA</span>
    </div>
  </section>

  <section id="liveStrip" class="live-strip"></section>
  <nav id="filters" class="filters"></nav>
  <section id="fixtures"></section>
</main>
<script src="app.js"></script>
</body>
</html>
