<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FootballEdge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">FOOTBALL<span>EDGE</span></div><div id="feedStatus" class="status">LOADING FEED…</div></header>
<main>
  <section class="hero">
    <div>
      <div class="kicker">MATCHDAY INTELLIGENCE</div>
      <h1>Today's Football</h1>
      <p>Live scores · form · H2H · league strength · positions · injuries · RotoWire lineups · model verdict</p>
    </div>
    <div class="updated">Updated <b id="updated">—</b><br><button id="refresh">Refresh</button></div>
  </section>

  <section id="liveStrip" class="live-strip"></section>
  <nav id="filters" class="filters"></nav>
  <section id="fixtures" class="fixtures"></section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
