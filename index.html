<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071019">
<title>FootballEdge — Matchday Intelligence</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FOOTBALL<span>EDGE</span></div>
  <div class="top-meta">
    <span id="feedStatus">LOADING</span>
    <span class="dot"></span>
    <span>FOTMOB DATA</span>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="eyebrow">MATCHDAY INTELLIGENCE</div>
      <h1>Today's Football</h1>
      <p>Live scores · form · H2H · league strength · positions · xG · lineups · model decision</p>
    </div>
    <div class="refresh-wrap">
      <div>Updated <strong id="updated">—</strong></div>
      <button id="refresh" class="ghost">↻ Refresh</button>
    </div>
  </section>

  <section id="liveStrip" class="live-strip"></section>
  <nav id="filters" class="filters"></nav>
  <section id="fixtures" class="fixtures"></section>
</main>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
