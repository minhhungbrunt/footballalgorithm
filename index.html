<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Edge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">FOOTBALL<span>EDGE</span></div>
  <div id="status" class="status">READY</div>
</header>

<main>
  <section class="top">
    <div>
      <div class="eyebrow">MATCH INTELLIGENCE</div>
      <h1>Today's Football Edge</h1>
      <p>Form · H2H · xG · injuries · lineups · market edge</p>
    </div>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
  </section>

  <section class="searchbar">
    <input id="homeTeam" placeholder="Home team">
    <input id="awayTeam" placeholder="Away team">
    <input id="competition" placeholder="Competition">
    <button id="customBtn">Analyze teams</button>
  </section>

  <section class="hero">
    <div class="heroHead">
      <div>
        <div class="eyebrow">★ MAIN GAME</div>
        <div id="mainMatch" class="mainMatch">Loading today's fixtures...</div>
      </div>
      <div id="mainTime" class="muted"></div>
    </div>
    <div id="mainAnalysis"></div>
  </section>

  <div class="sectionTitle">
    <h2>Today's games</h2>
    <input id="filter" placeholder="Filter teams or competition">
  </div>
  <section id="games" class="games"></section>

  <section id="analysis" class="analysis"></section>

  <footer>
    <span>Football Edge</span>
    <span>Model output is statistical, not guaranteed.</span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
